<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCC | SignIn</title>
    <script type="module" src="auth.js"></script>
    <link rel="prefetch"
        href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon" href="https://kcc24.live/assets/kcclogo48.png" type="image/png">
    <link rel="icon" href="https://kcc24.live/assets/kcclogo48.png" type="image/png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style type="text/tailwindcss">
        @layer base {
            @font-face {
                font-family: 'NovithaScriptDemo';
                src: url('./fonts/novitha_script/NovithaScriptDemo2.woff2') format('woff2');
            }

            @font-face {
                font-family: 'DegularVariable';
                src: url('./fonts/Degular_font/DegularVariable.woff2') format('woff2');
            }
        }

        @layer utilities {
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "DegularVariable", sans-serif;
            font-optical-sizing: auto;
        }

        .card {
           
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 24px;
            width: 100%;
            max-width: 400px;
        }

        .btn {
            background-color: #E3223B;
            color: white;
        }

        .btn:hover {
            background-color: #C21A33;
        }
    }
    </style>
</head>

<body class="bg-gray-900 text-white bg-cover" style="background-image: url('./assets/bg.webp');">
    <div
        class=" text-sm rounded-lg  block card p-2.5 bg-gray-700 bg-opacity-20 backdrop-blur-md  placeholder-gray-400 text-white focus:ring-blue-500 focus:border-blue-500">

        <h2 class="text-2xl font-bold mb-6 text-center">Sign In</h2>



        <form id="signInForm" class="mb-4">
            <div class="mb-4">
                <label for="email" class="block text-gray-100">Email</label>
                <input type="email" id="email"
                    class="placeholder-gray-700 text-gray-900 w-full p-2 border border-gray-300 rounded"
                    placeholder="Type your Email" required>
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-100">Password</label>
                <input type="password" id="password"
                    class="placeholder-gray-700 text-gray-900 w-full p-2 border border-gray-300 rounded"
                    placeholder="Type your password" required>
            </div>
            <button type="submit" class="btn w-full py-2 rounded">Sign in with Email</button>
        </form>
        <div class="h-[.1px] my-4 mx-auto w-[50%] bg-white"></div>
        <div class="mb-4">
            <button onclick="signInWithGoogle()" class="w-full rounded mb-2">Sign in with Google</button>
        </div>

        <div id="error" class="text-red-500 text-center"></div>
    </div>


    <script rel="prefetch" src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.4.1/dist/flowbite.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
</body>

</html>
